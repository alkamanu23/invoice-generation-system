  # ─── Invoices v3 ─────────────────────────────────────────────────────────────

  /v3/api/invoices/{id}:
    delete:
      tags:
        - Invoices
      summary: Delete an invoice by ID
      description: >
        Deletes the invoice with the given ID. Only the user who created the
        invoice can delete it. Returns 403 if the invoice belongs to another user.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Invoice deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invoice deleted successfully
        '400':
          description: Invalid invoice ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — invoice belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v3/api/stats:
    get:
      tags:
